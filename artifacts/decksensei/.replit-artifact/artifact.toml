kind = "web"
previewPath = "/"
title = "Deck Sensei"
version = "1.0.0"
id = "artifacts/topdeckcoach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/decksensei run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/decksensei", "run", "build" ]
run = "pnpm --filter @workspace/decksensei run start"
