kind = "web"
previewPath = "/"
title = "TopdeckCoach"
version = "1.0.0"
id = "artifacts/topdeckcoach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20561

[services.development]
run = "pnpm --filter @workspace/topdeckcoach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/topdeckcoach", "run", "build" ]
run = "pnpm --filter @workspace/topdeckcoach run start"

[services.env]
PORT = "20561"
